  <style>
    :root {
      --bg-1: #07140d; --bg-2: #0f2a1c; --moss: #9be7a8; --fern: #5e9c62; --leaf: #2e5e3a; --gold: #d8b45a; --cream: #f3eedb;
      --text: #eef6e8; --muted: #b3c9b0; --glass: rgba(20, 48, 32, .55); --line: rgba(190, 235, 195, .22);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font: 16px/1.5 "Nunito", system-ui, sans-serif; color: var(--text); overflow-x: hidden;
      background: radial-gradient(900px 600px at 50% -10%, #23573a 0%, transparent 60%), radial-gradient(700px 500px at 100% 100%, rgba(216, 180, 90, .14), transparent 60%), linear-gradient(180deg, var(--bg-2), var(--bg-1));
      background-color: var(--bg-1); background-attachment: fixed;
    }
    /* layered forest canopy silhouettes */
    .canopy { position: fixed; left: 0; right: 0; pointer-events: none; z-index: 0; }
    .canopy.top { top: -10px; height: 180px; opacity: .55; }
    .canopy.bottom { bottom: -4px; height: 220px; }
    .canopy svg { width: 100%; height: 100%; }
    .sway { transform-origin: 50% 0; animation: sway 9s ease-in-out infinite; }
    @keyframes sway { 50% { transform: rotate(.6deg) translateX(6px); } }
    canvas#flies { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

    .wrap { position: relative; z-index: 2; max-width: 560px; margin: 0 auto; padding: 48px 16px 160px; text-align: center; }
    .avatar-ring { position: relative; width: 132px; height: 132px; margin: 0 auto 14px; }
    .avatar-ring::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; background: conic-gradient(from 0deg, var(--moss), var(--gold), var(--fern), var(--moss)); filter: blur(10px); opacity: .7; animation: spin 10s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .avatar { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 3px solid var(--cream); background: radial-gradient(circle at 35% 30%, #3f7a4c, #12301f); display: grid; place-items: center; font-size: 3.8rem; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .vine { position: absolute; inset: -22px; width: calc(100% + 44px); height: calc(100% + 44px); pointer-events: none; }
    .vine path { stroke-dasharray: 400; stroke-dashoffset: 400; animation: grow 2.4s ease-out .3s forwards; }
    @keyframes grow { to { stroke-dashoffset: 0; } }
    .vine .lf { opacity: 0; animation: pop .5s ease-out forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
    h1 { font: 600 2.3rem/1.1 "Fraunces", Georgia, serif; margin: 6px 0 2px; letter-spacing: -.01em; }
    h1 em { color: var(--moss); font-style: italic; }
    .handle { color: var(--gold); font-weight: 800; letter-spacing: .06em; font-size: .9rem; }
    .bio { color: var(--muted); margin: 10px auto 0; max-width: 420px; }
    .tagline { font: 600 1.45rem "Caveat", cursive; color: var(--cream); margin: 6px 0 0; opacity: .9; }

    .today { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 20px 0 6px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); font-size: .82rem; font-weight: 700; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

    .feature { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; text-align: left; margin: 22px 0 14px; padding: 12px; border-radius: 22px; color: var(--text); text-decoration: none;
      background: linear-gradient(135deg, rgba(155, 231, 168, .22), rgba(216, 180, 90, .14)); border: 1px solid rgba(155, 231, 168, .45); box-shadow: 0 10px 40px rgba(0, 0, 0, .35), 0 0 40px rgba(155, 231, 168, .12); transition: transform .25s, box-shadow .25s; position: relative; overflow: hidden; }
    .feature:hover { transform: translateY(-3px); box-shadow: 0 14px 50px rgba(0, 0, 0, .4), 0 0 60px rgba(155, 231, 168, .25); }
    .feature .ph { width: 96px; height: 96px; border-radius: 16px; overflow: hidden; background: #f3eedb; display: grid; place-items: center; font-size: 2.6rem; }
    .feature .ph img { width: 100%; height: 100%; object-fit: cover; }
    .feature small { color: var(--gold); text-transform: uppercase; letter-spacing: .12em; font-weight: 800; font-size: .68rem; }
    .feature b { display: block; font: 600 1.25rem "Fraunces", serif; margin: 2px 0; }
    .feature span { color: var(--muted); font-size: .88rem; }

    .links { display: grid; gap: 12px; margin-top: 8px; }
    .link { position: relative; display: flex; align-items: center; gap: 14px; padding: 15px 18px; border-radius: 999px 22px 999px 22px; text-decoration: none; color: var(--text); font-weight: 800; font-size: 1.02rem;
      background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .06);
      overflow: hidden; transition: transform .2s, border-color .2s, background .2s; opacity: 0; transform: translateY(16px); animation: rise .6s cubic-bezier(.2, .9, .3, 1.2) forwards; }
    .link:nth-child(even) { border-radius: 22px 999px 22px 999px; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    .link::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .16), transparent); transform: skewX(-20deg); transition: left .7s; }
    .link:hover { transform: translateY(-2px) scale(1.01); border-color: rgba(155, 231, 168, .6); background: rgba(46, 94, 58, .6); }
    .link:hover::after { left: 130%; }
    .link .ic { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, rgba(155, 231, 168, .45), rgba(46, 94, 58, .5)); font-size: 1.25rem; }
    .link .lbl { flex: 1; text-align: left; } .link .lbl small { display: block; font-weight: 600; color: var(--muted); font-size: .78rem; }
    .link .arr { opacity: .55; transition: transform .2s; } .link:hover .arr { transform: translateX(4px); opacity: 1; }
    .link.primary { background: linear-gradient(135deg, var(--moss), var(--fern)); color: #08200f; border-color: transparent; }
    .link.primary .lbl small { color: #1d4a2a; } .link.primary .ic { background: rgba(255, 255, 255, .35); }

    .socials { display: flex; justify-content: center; gap: 12px; margin: 26px 0 8px; flex-wrap: wrap; }
    .socials a { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); color: var(--cream); transition: transform .2s, background .2s; }
    .socials a:hover { transform: translateY(-3px) rotate(-6deg); background: rgba(155, 231, 168, .25); }
    .socials svg { width: 21px; height: 21px; fill: currentColor; }
    .share { margin-top: 14px; background: none; border: 1px dashed var(--line); color: var(--muted); padding: 8px 16px; border-radius: 999px; font: 700 .85rem "Nunito", sans-serif; cursor: pointer; }
    .share:hover { color: var(--text); border-color: var(--moss); }
    footer { margin-top: 26px; color: rgba(179, 201, 176, .7); font-size: .78rem; }
    footer .seal { font: 600 1.2rem "Caveat", cursive; color: var(--gold); display: block; }
    .link:focus-visible, .feature:focus-visible, .socials a:focus-visible, .share:focus-visible { outline: 2px solid var(--moss); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .link, .vine path, .vine .lf { opacity: 1; transform: none; stroke-dashoffset: 0; } }
    @media (max-width: 420px) { h1 { font-size: 2rem; } .feature { grid-template-columns: 76px 1fr; } .feature .ph { width: 76px; height: 76px; } }
  </style>
</head>

  <script>
  (() => {
    const C = window.LINKTREE, $ = s => document.querySelector(s);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    // profile
    if (C.avatar) $("#avatar").innerHTML = `<img src="${esc(C.avatar)}" alt="${esc(C.name)}">`;
    $("#name").innerHTML = C.name === "Bodyverse" ? "Body<em>verse</em>" : esc(C.name);
    $("#handle").textContent = C.handle; $("#tagline").textContent = C.tagline; $("#bio").textContent = C.bio;
    // links
    $("#links").innerHTML = C.links.filter(l => l.url).map((l, i) => `<a class="link ${l.primary ? "primary" : ""}" href="${esc(l.url)}" style="animation-delay:${.35 + i * .08}s" ${/^https?:/.test(l.url) ? 'target="_blank" rel="noopener"' : ""}>
      <span class="ic">${l.icon}</span><span class="lbl">${esc(l.label)}${l.sub ? `<small>${esc(l.sub)}</small>` : ""}</span><span class="arr">→</span></a>`).join("");
    // socials
    const ICONS = {
      instagram: '<path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 3.9 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zM12 7a5 5 0 100 10 5 5 0 000-10zm0 8.2a3.2 3.2 0 110-6.4 3.2 3.2 0 010 6.4zm5.2-9.6a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4z"/>',
      tiktok: '<path d="M19.6 6.7a4.8 4.8 0 01-3.8-4.2V2h-3.4v13.6a2.9 2.9 0 11-2-2.7V9.4a6.3 6.3 0 105.4 6.2V8.7a8.2 8.2 0 003.8 1.2z"/>',
      youtube: '<path d="M23.5 6.2a3 3 0 00-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 00.5 6.2 31 31 0 000 12a31 31 0 00.5 5.8 3 3 0 002.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 002.1-2.1A31 31 0 0024 12a31 31 0 00-.5-5.8zM9.6 15.6V8.4L15.8 12z"/>',
      pinterest: '<path d="M12 2a10 10 0 00-3.6 19.3c-.1-.8-.2-2 0-2.9l1.2-5s-.3-.6-.3-1.5c0-1.4.8-2.4 1.8-2.4.9 0 1.3.6 1.3 1.4 0 .9-.5 2.1-.8 3.3-.2 1 .5 1.8 1.5 1.8 1.8 0 3.1-1.9 3.1-4.6 0-2.4-1.7-4.1-4.2-4.1-2.9 0-4.5 2.1-4.5 4.4 0 .9.3 1.8.8 2.3.1.1.1.2.1.3l-.3 1.2c0 .2-.2.3-.4.2-1.3-.6-2.1-2.5-2.1-4 0-3.3 2.4-6.3 6.9-6.3 3.6 0 6.4 2.6 6.4 6 0 3.6-2.3 6.5-5.4 6.5-1.1 0-2.1-.6-2.4-1.2l-.7 2.5c-.2.9-.9 2.1-1.3 2.8A10 10 0 1012 2z"/>',
      spotify: '<path d="M12 2a10 10 0 100 20 10 10 0 000-20zm4.6 14.4a.6.6 0 01-.9.2c-2.4-1.5-5.3-1.8-8.8-1a.6.6 0 11-.3-1.2c3.8-.9 7.1-.5 9.8 1.1.3.2.4.6.2.9zm1.2-2.7a.8.8 0 01-1.1.3c-2.7-1.7-6.9-2.2-10.2-1.2a.8.8 0 01-.5-1.5c3.7-1.1 8.3-.6 11.4 1.3.4.3.5.8.4 1.1zm.1-2.8C14.7 9 9.3 8.8 6.2 9.8a.9.9 0 11-.5-1.8c3.6-1.1 9.5-.9 13.2 1.3a.9.9 0 01-.9 1.6z"/>',

    $("#socials").innerHTML = Object.entries(C.socials).filter(([, u]) => u).map(([k, u]) => `<a href="${esc(u)}" aria-label="${k}" title="${k}" ${/^https?:/.test(u) ? 'target="_blank" rel="noopener"' : ""}><svg viewBox="0 0 24 24">${ICONS[k] || ""}</svg></a>`).join("");

    const now = new Date(), m = now.getMonth() + 1;
    const season = m >= 3 && m <= 5 ? ["🌸", "Spring"] : m >= 6 && m <= 8 ? ["☀️", "Summer"] : m >= 9 && m <= 11 ? ["🍂", "Autumn"] : ["❄️", "Winter"];
    const age = ((((now.getTime() / 864e5 + 2440587.5) - 2451550.1) / 29.530588853) % 1 + 1) % 1, idx = Math.floor(age * 8 + .5) % 8;
    const moon = [["🌑", "New Moon"], ["🌒", "Waxing Crescent"], ["🌓", "First Quarter"], ["🌔", "Waxing Gibbous"], ["🌕", "Full Moon"], ["🌖", "Waning Gibbous"], ["🌗", "Last Quarter"], ["🌘", "Waning Crescent"]][idx];
    $("#today").innerHTML = `<span class="pill">${season[0]} ${season[1]}</span><span class="pill">${moon[0]} ${moon[1]}</span><span class="pill">📅 ${now.toLocaleDateString([], { weekday: "long" })}</span>`;
    const plants = [["lavender", "Lavender", "Lavandula_angustifolia", "Calm, sleep & bees"], ["chamomile", "Chamomile", "Matricaria_chamomilla", "Gentle digestion & rest"], ["calendula", "Calendula", "Calendula_officinalis", "Soothing skin ally"], ["nettle", "Stinging Nettle", "Urtica_dioica", "Mineral-rich spring tonic"], ["rose", "Rose", "Rosa_×_damascena", "Heart-opening & skin"], ["elderberry", "Elder", "Sambucus_nigra", "Winter immune folklore"], ["rosemary", "Rosemary", "Rosemary", "Memory & hair"], ["tulsi", "Holy Basil", "Ocimum_tenuiflorum", "Queen of herbs"], ["ginger", "Ginger", "Ginger", "Warming & settling"], ["hibiscus", "Hibiscus", "Roselle_(plant)", "Tart heart-healthy tea"], ["turmeric", "Turmeric", "Turmeric", "Golden & anti-inflammatory"], ["bluelotus", "Blue Lotus", "Nymphaea_caerulea", "Ancient Egyptian dream flower"]];
    const doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 864e5), p = plants[doy % plants.length];
    $("#potdName").textContent = p[1]; $("#potdText").textContent = `${p[3]} — read today's page →`; $("#feature").href = `${C.appUrl}#/codex/${p[0]}`;

      if (j.thumbnail?.source) { const img = new Image(); img.alt = p[1]; img.onload = () => { $("#potdPh").innerHTML = ""; $("#potdPh").appendChild(img); }; img.src = j.thumbnail.source; }
    }).catch(() => { });

    // share
    $("#share").onclick = async () => {
      try { if (navigator.share) await navigator.share({ title: C.name, url: location.href }); else { await navigator.clipboard.writeText(location.href); $("#share").textContent = "✓ Link copied"; } } catch (e) { }
    };

    // fireflies & drifting leaves
    const cv = $("#flies"), ctx = cv.getContext("2d"); let W, H, P = [];
    const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
    resize(); addEventListener("resize", resize);
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      P = Array.from({ length: Math.min(46, Math.floor(innerWidth / 18)) }, (_, i) => ({ x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 2.2, t: Math.random() * 100, s: .2 + Math.random() * .5, leaf: i % 7 === 0, a: Math.random() * 6 }));
      (function loop() {
        ctx.clearRect(0, 0, W, H);
        for (const f of P) {
          f.t += .015;
          if (f.leaf) {
            f.y += f.s; f.x += Math.sin(f.t) * .6; f.a += .01; if (f.y > H + 20) { f.y = -20; f.x = Math.random() * W; }

            ctx.beginPath(); ctx.moveTo(0, -7); ctx.quadraticCurveTo(6, 0, 0, 7); ctx.quadraticCurveTo(-6, 0, 0, -7); ctx.fill(); ctx.restore();
          } else {
            f.x += Math.cos(f.t * 1.3) * .35; f.y += Math.sin(f.t) * .3 - .05; if (f.y < -10) f.y = H + 10;
            const g = .5 + .5 * Math.sin(f.t * 3 + f.x);
            ctx.globalAlpha = .25 + .7 * g; ctx.shadowBlur = 14; ctx.shadowColor = "#e8ff9a"; ctx.fillStyle = "#f1ffb0";
            ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
          }
        }
        requestAnimationFrame(loop);
      })();
    }
  })();
